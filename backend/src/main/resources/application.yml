server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hostel-grievance-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hgs_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:hgs_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:hgs_secret_2026}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  storage:
    upload-dir: ${FILE_STORAGE_PATH:./uploads}
    max-file-size-mb: ${MAX_FILE_SIZE_MB:5}
  mail:
    from: ${MAIL_FROM:notifications@hgs.internal}
    simulate: ${MAIL_SIMULATE:true}
