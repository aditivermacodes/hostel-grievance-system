server:
  port: 8080

spring:
  application:
    name: hostel-grievance-system
  datasource:
    url: jdbc:h2:mem:hgs_local_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: localhost
    port: 1025

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-hours: 24
  storage:
    upload-dir: ./uploads
    max-file-size-mb: 5
  mail:
    from: notifications@hgs.internal
    simulate: true
